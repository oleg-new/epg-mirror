name: Update EPG mirror

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: epg-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build EPG and mirror icons
        env:
          ICON_BASE: https://raw.githubusercontent.com/${{ github.repository }}/main/icons
          ICON_SCOPE: channel
        run: python build_epg.py

      - name: Commit new icons to main
        run: |
          git config user.name  "epg-mirror-bot"
          git config user.email "epg-mirror-bot@users.noreply.github.com"
          git add icons
          if git diff --cached --quiet; then
            echo "No new icons"
          else
            git commit -m "Add/update icons $(date -u +%F)"
            git push origin HEAD:main
          fi

      - name: Publish EPG to data branch
        run: |
          rm -rf /tmp/pub && mkdir /tmp/pub
          cp out/epg2.xml.gz /tmp/pub/
          cd /tmp/pub
          git init -b data
          git config user.name  "epg-mirror-bot"
          git config user.email "epg-mirror-bot@users.noreply.github.com"
          git add epg2.xml.gz
          git commit -m "EPG $(date -u +'%F %H:%M UTC')"
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push -f origin data
